name: Deploy to Staging

on:
  push:
    branches:
      - staging  # trigger only on staging branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Set up Docker auth
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 🏗️ Build Docker image
        run: |
          docker build -t bfi-staging-service-monitor:latest .
          docker tag bfi-staging-service-monitor:latest braceforimpact/bfi-staging-service-monitor:latest

      - name: 📤 Push image to Docker Hub
        run: docker push braceforimpact/bfi-staging-service-monitor:latest

      - name: 🚀 Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/caution/deployments/bfi/bfi-infrastructure
            docker compose -f docker-compose.staging.yaml pull bfi-staging-service-monitor
            docker compose -f docker-compose.staging.yaml up --build -d bfi-staging-service-monitor
